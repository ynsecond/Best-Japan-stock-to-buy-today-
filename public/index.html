<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Japan Stock Picker - 今日買うべき最高の株</title>
  <style>
    :root {
      --primary: #1a237e;
      --primary-light: #3949ab;
      --accent: #ff6d00;
      --accent-light: #ff9100;
      --bg: #0a0e27;
      --bg-card: #111638;
      --bg-card-hover: #1a1f4a;
      --text: #e8eaf6;
      --text-muted: #9fa8da;
      --success: #00e676;
      --danger: #ff1744;
      --border: #283593;
      --gold: #ffd600;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .app-header {
      background: linear-gradient(135deg, var(--primary) 0%, #0d47a1 100%);
      padding: 20px 24px;
      text-align: center;
      border-bottom: 2px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .app-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .app-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 0;
      background: var(--primary);
      border-bottom: 1px solid var(--border);
    }

    .nav-tab {
      padding: 12px 32px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }

    .nav-tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .nav-tab.active { color: var(--gold); border-bottom-color: var(--accent); }

    .page { display: none; padding: 24px; max-width: 900px; margin: 0 auto; }
    .page.active { display: block; }

    /* === Main Page === */
    .main-action {
      text-align: center;
      margin: 60px 0 40px;
    }

    .find-btn {
      background: linear-gradient(135deg, var(--accent) 0%, #e65100 100%);
      color: #fff;
      border: none;
      padding: 24px 48px;
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 24px rgba(255,109,0,0.4);
      letter-spacing: 1px;
    }

    .find-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(255,109,0,0.6);
    }

    .find-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .find-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    /* Loading */
    .loading-container {
      display: none;
      text-align: center;
      margin: 40px 0;
    }

    .loading-container.active { display: block; }

    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 1rem;
      color: var(--text-muted);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse { 50% { opacity: 0.5; } }

    /* Result Card */
    .result-card {
      display: none;
      background: var(--bg-card);
      border: 2px solid var(--gold);
      border-radius: 16px;
      padding: 32px;
      margin: 20px 0;
      box-shadow: 0 4px 24px rgba(255,214,0,0.15);
    }

    .result-card.active { display: block; animation: fadeIn 0.5s ease; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .result-ticker {
      font-size: 2rem;
      font-weight: 800;
      color: var(--gold);
    }

    .result-name {
      font-size: 1.2rem;
      color: var(--text);
      margin-top: 4px;
    }

    .result-sector {
      display: inline-block;
      padding: 4px 12px;
      background: var(--primary-light);
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .result-score {
      text-align: right;
    }

    .score-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--success);
    }

    .score-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .result-price {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin: 16px 0;
    }

    .result-price span { font-size: 0.9rem; color: var(--text-muted); }

    .reasons-list {
      list-style: none;
      margin-top: 16px;
    }

    .reasons-list li {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reasons-list li::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .reasons-title {
      font-weight: 700;
      color: var(--accent-light);
      margin-top: 20px;
      margin-bottom: 8px;
      font-size: 1rem;
    }

    /* Error */
    .error-msg {
      display: none;
      background: rgba(255,23,68,0.1);
      border: 1px solid var(--danger);
      border-radius: 8px;
      padding: 16px;
      color: var(--danger);
      text-align: center;
      margin: 20px 0;
    }

    .error-msg.active { display: block; }

    /* === History Page === */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .history-header h2 {
      font-size: 1.3rem;
      color: var(--text);
    }

    .update-prices-btn {
      background: var(--primary-light);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 20px;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .update-prices-btn:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
    }

    .update-prices-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .history-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 60px 20px;
      font-size: 1rem;
    }

    .history-list { display: flex; flex-direction: column; gap: 12px; }

    .history-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.2s;
    }

    .history-item:hover { background: var(--bg-card-hover); }

    .history-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .history-item-info { flex: 1; }

    .history-item-ticker {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold);
    }

    .history-item-name {
      font-size: 0.95rem;
      color: var(--text);
      margin-left: 8px;
    }

    .history-item-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .history-item-prices {
      display: flex;
      gap: 24px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .price-box {
      display: flex;
      flex-direction: column;
    }

    .price-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .price-value {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .change-positive { color: var(--success); }
    .change-negative { color: var(--danger); }
    .change-neutral { color: var(--text-muted); }

    .history-item-actions {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .delete-btn {
      background: none;
      border: 1px solid rgba(255,23,68,0.3);
      color: var(--danger);
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background: rgba(255,23,68,0.15);
      border-color: var(--danger);
    }

    .history-item-reasons {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .reason-tag {
      padding: 3px 10px;
      background: rgba(57,73,171,0.3);
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .find-btn { padding: 18px 32px; font-size: 1.1rem; }
      .result-header { flex-direction: column; }
      .result-score { text-align: left; margin-top: 12px; }
      .nav-tab { padding: 10px 16px; font-size: 0.85rem; }
      .page { padding: 16px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>Best Japan Stock Picker</h1>
    <p>東証全銘柄からAI分析で今日買うべき最高の株を発見</p>
  </header>

  <nav class="nav-tabs">
    <button class="nav-tab active" data-page="main">銘柄検出</button>
    <button class="nav-tab" data-page="history">検出履歴</button>
  </nav>

  <!-- Main Page -->
  <div id="page-main" class="page active">
    <div class="main-action">
      <button id="find-btn" class="find-btn">
        今日買うべき最高の株を探す
      </button>
    </div>

    <div id="loading" class="loading-container">
      <div class="spinner"></div>
      <div class="loading-text">東証銘柄をプロ級テクニカル分析で解析中...</div>
      <div class="loading-text" style="margin-top:8px;font-size:0.85rem;">
        RSI / MACD / ボリンジャーバンド / 一目均衡表 / 出来高分析 / ストキャスティクスなど多角的に評価しています
      </div>
    </div>

    <div id="error" class="error-msg"></div>

    <div id="result" class="result-card">
      <div class="result-header">
        <div>
          <div class="result-ticker" id="result-ticker"></div>
          <div class="result-name" id="result-name"></div>
          <div class="result-sector" id="result-sector"></div>
        </div>
        <div class="result-score">
          <div class="score-value" id="result-score"></div>
          <div class="score-label">総合スコア</div>
        </div>
      </div>
      <div class="result-price" id="result-price"></div>
      <div class="reasons-title">検出理由（買いシグナル）</div>
      <ul class="reasons-list" id="result-reasons"></ul>
    </div>
  </div>

  <!-- History Page -->
  <div id="page-history" class="page">
    <div class="history-header">
      <h2>検出履歴 / 騰落率トラッキング</h2>
      <button id="update-prices-btn" class="update-prices-btn">価格を更新</button>
    </div>
    <div id="history-list" class="history-list">
      <div class="history-empty">まだ検出された銘柄がありません。</div>
    </div>
  </div>

  <script>
    // === Navigation ===
    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('page-' + tab.dataset.page).classList.add('active');

        if (tab.dataset.page === 'history') loadHistory();
      });
    });

    // === Find Best Stock ===
    const findBtn = document.getElementById('find-btn');
    const loading = document.getElementById('loading');
    const errorDiv = document.getElementById('error');
    const resultCard = document.getElementById('result');

    findBtn.addEventListener('click', async () => {
      findBtn.disabled = true;
      loading.classList.add('active');
      errorDiv.classList.remove('active');
      resultCard.classList.remove('active');

      try {
        const resp = await fetch('/api/find-best-stock', { method: 'POST' });
        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.error || '不明なエラー');
        }

        document.getElementById('result-ticker').textContent = data.ticker + '.T';
        document.getElementById('result-name').textContent = data.name;
        document.getElementById('result-sector').textContent = data.sector;
        document.getElementById('result-score').textContent = data.totalScore;
        document.getElementById('result-price').innerHTML =
          `&yen;${Number(data.price).toLocaleString()} <span>現在値</span>`;

        const reasonsList = document.getElementById('result-reasons');
        reasonsList.innerHTML = '';
        (data.reasons || []).forEach(r => {
          const li = document.createElement('li');
          li.textContent = r;
          reasonsList.appendChild(li);
        });

        resultCard.classList.add('active');
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.add('active');
      } finally {
        loading.classList.remove('active');
        findBtn.disabled = false;
      }
    });

    // === History ===
    async function loadHistory() {
      const container = document.getElementById('history-list');
      try {
        const resp = await fetch('/api/history');
        const data = await resp.json();

        if (data.length === 0) {
          container.innerHTML = '<div class="history-empty">まだ検出された銘柄がありません。</div>';
          return;
        }

        container.innerHTML = data.map(item => {
          const changePct = item.change_pct || 0;
          const changeClass = changePct > 0 ? 'change-positive' : changePct < 0 ? 'change-negative' : 'change-neutral';
          const changeSign = changePct > 0 ? '+' : '';
          const detectedDate = new Date(item.detected_at).toLocaleString('ja-JP');
          const lastUpdated = item.last_updated ? new Date(item.last_updated).toLocaleString('ja-JP') : '-';
          const reasons = item.reasons ? JSON.parse(item.reasons) : [];

          return `
            <div class="history-item" data-id="${item.id}">
              <div class="history-item-header">
                <div class="history-item-info">
                  <span class="history-item-ticker">${item.ticker}.T</span>
                  <span class="history-item-name">${item.name}</span>
                  <div class="history-item-date">検出日時: ${detectedDate}</div>
                  <div class="history-item-date">最終更新: ${lastUpdated}</div>
                </div>
                <div class="history-item-actions">
                  <button class="delete-btn" onclick="deleteHistory(${item.id})">削除</button>
                </div>
              </div>
              <div class="history-item-prices">
                <div class="price-box">
                  <span class="price-label">検出時価格</span>
                  <span class="price-value">&yen;${Number(item.detected_price).toLocaleString()}</span>
                </div>
                <div class="price-box">
                  <span class="price-label">現在価格</span>
                  <span class="price-value">&yen;${item.current_price ? Number(item.current_price).toLocaleString() : '-'}</span>
                </div>
                <div class="price-box">
                  <span class="price-label">騰落率</span>
                  <span class="price-value ${changeClass}">${changeSign}${changePct.toFixed(2)}%</span>
                </div>
              </div>
              ${reasons.length > 0 ? `
                <div class="history-item-reasons">
                  ${reasons.map(r => `<span class="reason-tag">${r}</span>`).join('')}
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="history-empty" style="color:var(--danger)">履歴の読み込みに失敗しました。</div>`;
      }
    }

    // Delete history item
    async function deleteHistory(id) {
      if (!confirm('この履歴を削除しますか？')) return;
      try {
        const resp = await fetch(`/api/history/${id}`, { method: 'DELETE' });
        if (resp.ok) loadHistory();
      } catch (err) {
        alert('削除に失敗しました。');
      }
    }

    // Update prices
    document.getElementById('update-prices-btn').addEventListener('click', async function() {
      this.disabled = true;
      this.textContent = '更新中...';
      try {
        await fetch('/api/history/update-prices', { method: 'POST' });
        await loadHistory();
      } catch (err) {
        alert('価格更新に失敗しました。');
      } finally {
        this.disabled = false;
        this.textContent = '価格を更新';
      }
    });
  </script>
</body>
</html>
